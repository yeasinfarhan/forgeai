server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (the API's JSON included).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    # Security headers. nginx does not inherit add_header into locations that set their own, so
    # every location below repeats them. Mermaid diagrams need inline styles; fonts come from Google Fonts.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Forward API calls to the backend container (same-origin, so no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlates nginx's request with the backend's logs.
        proxy_set_header X-Request-Id $request_id;
        # AI generation can take minutes: up to 3 attempts of AI_TIMEOUT (120 s) plus back-off.
        # Keep this longer than the backend's worst case, or the browser gives up while the
        # backend is still working.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Long-lived caching for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point, which is never cached
    # so a new release is picked up on the next visit.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
