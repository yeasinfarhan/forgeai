# ForgeAI local stack: PostgreSQL + backend API + frontend (nginx).
#
#   docker compose up -d postgres     # database only (for local backend/frontend development)
#   docker compose up --build         # full stack
#
# Values come from the .env file next to this file (copy .env.example to .env).

name: forgeai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgeai}
      POSTGRES_USER: ${DATABASE_USERNAME:-forgeai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the Compose network the database host is the service name, not localhost.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-forgeai}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-forgeai}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT8H}
      # Per-user AI allowance (0 = no limit) and sign-in protection.
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-60}
      AI_TOKENS_PER_DAY: ${AI_TOKENS_PER_DAY:-2000000}
      LOGIN_MAX_FAILURES_PER_EMAIL: ${LOGIN_MAX_FAILURES_PER_EMAIL:-10}
      LOGIN_MAX_FAILURES_PER_ADDRESS: ${LOGIN_MAX_FAILURES_PER_ADDRESS:-50}
      # Requests arrive through the frontend's nginx: take the client address from X-Forwarded-For.
      FORWARD_HEADERS_STRATEGY: native
      # JSON logs (ecs, logstash or gelf), with trace and request ids.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
    ports:
      # Only reachable from this machine; browsers use the API through the frontend (/api).
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    # Actuator (health, Prometheus metrics) listens on 8081 inside the Compose network only.
    expose:
      - "8081"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
