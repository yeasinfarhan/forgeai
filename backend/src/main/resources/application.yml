spring:
  application:
    name: forgeai-backend

  # Settings are read from environment variables. For local development the
  # project-root .env file is also loaded (when present), so the backend and
  # docker-compose.yml share one source of configuration. Real environment
  # variables always take precedence over values in .env.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/forgeai}
    username: ${DATABASE_USERNAME:forgeai}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: forgeai-pool
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration).
      # Hibernate only checks that the entity mappings match it.
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

forgeai:
  security:
    jwt:
      # HMAC key for signing access tokens. Must be at least 32 bytes.
      secret: ${JWT_SECRET:}
      # ISO-8601 duration, e.g. PT8H = 8 hours.
      expiration: ${JWT_EXPIRATION:PT8H}

  ai:
    # Which model provider answers AI requests: claude (default) or gemini.
    # Without the selected provider's API key the app runs normally; AI features report "not configured".
    provider: ${AI_PROVIDER:claude}
    # Upper bound for one response, including the model's thinking.
    max-tokens: ${AI_MAX_TOKENS:16000}
    timeout: ${AI_TIMEOUT:PT120S}
    max-retries: ${AI_MAX_RETRIES:2}
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-5-5}
      base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

  # Per-user allowance for AI calls, counted over a rolling window. 0 turns a limit off.
  usage:
    requests-per-hour: ${AI_REQUESTS_PER_HOUR:60}
    tokens-per-day: ${AI_TOKENS_PER_DAY:2000000}

  # Sign-in protection: failed sign-ins allowed per 15 minutes before further attempts are refused.
  login:
    max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:10}
    max-failures-per-address: ${LOGIN_MAX_FAILURES_PER_ADDRESS:50}

server:
  port: ${SERVER_PORT:8080}
  # Behind the frontend's nginx, set to "native" so client addresses come from X-Forwarded-For
  # (only trusted from private-network proxies).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    com.forgeai: ${FORGEAI_LOG_LEVEL:INFO}

# --- Observability ------------------------------------------------------------------
# Health, Prometheus metrics and other actuator endpoints are served on a separate port that is not
# published by docker-compose.yml (reachable inside the Compose network, e.g. by Prometheus).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Trace and metric export over OTLP is off unless a collector is configured: set
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (e.g. http://otel-collector:4318/v1/traces)
  # and OTLP_METRICS_ENABLED=true with MANAGEMENT_OTLP_METRICS_EXPORT_URL. Trace ids are always
  # written to the logs.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  metrics:
    tags:
      application: forgeai-backend
